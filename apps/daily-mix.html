<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../shared/theme.css?v=5888ae40">
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <a class="back" href="../index.html">← All apps</a>
    <h1>🎯 Daily Mix</h1>
    <p class="tagline">12 questions from everything. Ten minutes. Come back tomorrow.</p>
  </div>
  <div id="game"></div>
</main>

<script src="../shared/engine.js?v=fa8318bc"></script>
<script src="../shared/algebra.js?v=58b56684"></script>
<script src="../shared/problems.js?v=7ef0eb90"></script>
<script src="../shared/linear.js?v=c28d79ac"></script>
<script src="../shared/grid.js?v=16d8f245"></script>
<script src="../shared/stories.js?v=01e9802e"></script>
<!-- every other app's registration, generated by tools/bundle.mjs -->
<script src="../shared/all-apps.js?v=3e02a7b2"></script>
<script>
MathLab.app('daily-mix', {
  emoji: '🎯',
  title: 'Daily Mix',
  tagline: '12 questions from everything. Ten minutes. Come back tomorrow.',
  blurb: 'A short mixed session every day: mostly this chapter, some older topics so they stay fresh.',

  build() {
  const { pick, note } = MathLab;

  /*
   * Interleaving is the best-supported technique for this age (Rohrer et al. 2020, d ≈ 0.83)
   * and spacing keeps older topics alive. So a session mixes ~75% of this chapter with ~25%
   * review, never says which topic a question is from, and is short enough to repeat daily.
   */
  const CHAPTER = ['line-lab', 'crossing', 'two-equations', 'story-solver'];
  const REVIEW = ['step-builder', 'like-terms', 'substitution', 'hcf-detective', 'chocolate-box'];
  const SESSION = 12;

  const available = new Map(MathLab.listApps().filter((a) => a.key !== 'daily-mix').map((a) => [a.key, a]));
  const levelCache = new Map();
  const levelsOf = (key) => {
    if (!levelCache.has(key)) levelCache.set(key, available.get(key).build());
    return levelCache.get(key);
  };
  // the levels that are practice, not settings: skip Mixed (it already mixes) and the extras
  const playable = (key) => levelsOf(key).filter((lv) => !/^(Mixed|🌶|✍️|Which kind\?|Match the story)/.test(lv.name));

  let count = 0;
  let results = [];
  let lastMisses = 0;

  function pickRound() {
    const chapter = CHAPTER.filter((k) => available.has(k));
    const review = REVIEW.filter((k) => available.has(k));
    const useReview = review.length && Math.random() < 0.25;
    const key = pick(useReview ? review : chapter);
    const levels = playable(key);
    // two misses in a row: step down to the first, gentlest level of an app
    const lv = lastMisses >= 2 ? levels[0] : pick(levels);
    return { key, lv };
  }

  function sessionRound() {
    if (count >= SESSION) return summary();
    count += 1;
    const { key, lv } = pickRound();
    const inner = lv.make();
    const round = {
      ...inner,
      origin: { app: key, level: lv.name },
      noHint: !!available.get(key).ownHints || inner.noHint,   // those apps bring their own Stuck? button
      prompt: '<span class="kind-blurb">' + count + ' of ' + SESSION + '</span>' + (inner.prompt || ''),
      mount(stage, submit) {
        inner.mount(stage, (ok, pts, why) => {
          const first = ok && inner.firstTry !== false;
          results.push({ key, ok: first });
          lastMisses = first ? 0 : lastMisses + 1;
          round.firstTry = inner.firstTry;
          submit(ok, pts, why);
        });
      },
    };
    return round;
  }

  function summary() {
    const right = results.filter((r) => r.ok).length;
    const byApp = {};
    for (const r of results) {
      byApp[r.key] = byApp[r.key] || { n: 0, ok: 0 };
      byApp[r.key].n++;
      if (r.ok) byApp[r.key].ok++;
    }
    note('session', { right, of: results.length });
    const rows = Object.entries(byApp).map(([k, v]) =>
      '<tr><td>' + available.get(k).emoji + ' ' + available.get(k).title + '</td><td class="n">' + v.ok + ' / ' + v.n + '</td></tr>').join('');
    return {
      noScore: true,
      prompt: 'Session done',
      question: '',
      mount(stage, submit) {
        stage.innerHTML = '<div class="report"><p class="summary-big">' + right + ' / ' + results.length + '</p>' +
          '<p>right first time. Spaced practice works best a little every day — come back tomorrow for the next mix.</p>' +
          '<table>' + rows + '</table></div>';
        count = 0;
        results = [];
        lastMisses = 0;
        submit(true);
      },
    };
  }

  /* ---------------- report for grown-ups ---------------- */

  const TRAPS = {
    'implicit-one': 'Read −x as gradient 0',
    'gradient-sign': 'Gradient sign flipped',
    'intercept-sign': 'Intercept sign flipped',
    'intercept-x-axis': 'Put the y-intercept on the x-axis',
    'coefficient-as-gradient': 'Took the x-coefficient as gradient without rearranging',
    'forgot-divide': 'Rearranged but did not divide by the y-coefficient',
    'm-c-swapped': 'Swapped gradient and intercept',
    'intercepts-merged': 'Merged two intercepts into one point',
    'intercepts-swapped': 'Swapped the intercepts',
    'x-equals-horizontal': 'Took x = a as a horizontal line',
    'intercept-vs-intersection': 'Intercept instead of intersection',
    'one-line-only': 'Point on one line only',
    'coordinates-swapped': 'Swapped x and y',
    'parallel-one': 'Parallel lines → "one solution"',
    'coincident-none': 'Same line → "no solution"',
    'checked-one-only': 'Checked a pair in one equation only',
    'scale-not-rhs': 'Multiplied an equation but not its right side',
    'scale-first-only': 'Multiplied only the first term',
    'add-vs-subtract': 'Added when it should subtract (or the reverse)',
    'subtract-rhs': 'Subtracted the letters but added the numbers',
    'subtract-negative': 'Taking away a negative',
    'collect-sign': 'Collecting like terms with different signs (−4y + y = −5y)',
    'collect-flip': 'Sign of a collected term',
    'move-sign': 'Moved a number across without changing its sign',
    'value-sign': 'Sign slip in the last division',
    'value-upside-down': 'Divided the wrong way round',
    'value-subtract': 'Subtracted instead of dividing',
    'sub-coefficient': 'Dropped the coefficient when substituting',
    'sub-sign': 'Sign of a product when substituting',
    'sub-no-bracket': 'Substituted without a bracket',
    'expand-sign': 'Sign in front of a bracket',
    'expand-first-only': 'Multiplied only the first term in a bracket',
    'count-is-value': 'Mixed up a count with a total value',
    'swap-values': 'Matched prices/values to the wrong letter',
    'units-mix': 'Mixed cents and dollars',
    'dropped-letter': 'Dropped the letter from a rate (y = 3 instead of 3x)',
    'more-reversed': '"k more than" the wrong way round',
    'times-reversed': '"k times as many" the wrong way round (6S = P)',
    'more-is-times': 'Read "more than" as "times"',
    'age-shift-one': 'Added the years to one person only',
    'age-bracket': '2(e + 6) written as 2e + 6',
    'consecutive-odd': 'Consecutive odd numbers as x and x + 1',
    'average-is-sum': 'Used the average as the sum',
    'angle-sum-360': 'Angle sum 360° in a triangle',
    'half-perimeter': 'Perimeter as l + w',
    'adjacent-sides': 'Set adjacent sides equal',
    'break-even-equal': 'Break-even point counted as "cheaper"',
    'nonsense-answer': 'Accepted a negative or fractional count',
    'answer-swapped': 'Swapped x and y in the final answer',
    'add-rhs': 'Added the letters but not the numbers',
    'age-direction': '"Years ago" added instead of subtracted',
    'age-shift-now': 'Shifted ages that are about now',
    'apex-equals-base': 'Wrong pair of equal angles in an isosceles triangle',
    'average-halved': 'Halved the average instead of doubling',
    'break-even-direction': 'Which deal wins on which side of break-even',
    'break-even-never': 'Thought the cheaper rate never catches up',
    'break-even-side': 'Picked the dearer deal for a given amount',
    'change-one-part': 'Changed only the top (or bottom) of a fraction',
    'check-pair': 'Judged whether a pair works without checking it',
    'collect-multiply': 'Multiplied like terms instead of adding them',
    'consecutive-one': 'Wrote only one of two consecutive numbers',
    'cross-multiply': 'Cross-multiplied the wrong way round',
    'crossing-other': 'Tapped a point that is not the crossing',
    'difference-order': 'Difference as small − big',
    'draw-line': 'Drew a line wrongly',
    'expand-skip-term': 'Skipped a term when opening a bracket',
    'fee-rate-swapped': 'Swapped the one-off fee and the rate',
    'fewer-reversed': '"k fewer" the wrong way round',
    'flat-gradient': 'Gradient of a flat line',
    'gradient-other': 'Gradient misread',
    'gradient-wrong': 'Right start, wrong steepness',
    'intercept-other': 'Intercept misread',
    'intercept-wrong': 'Right steepness, wrong start',
    'line-other': 'Line drawn wrongly',
    'match-story': 'Matched equations to the wrong story',
    'mixture-no-total': 'Mixture: forgot to multiply the strength by the total',
    'percent-is-amount': 'Used a percentage as an amount',
    'perimeter-doubled': 'Perimeter doubled twice',
    'scale-arith': 'Arithmetic slip when multiplying an equation',
    'schema': 'Recognising the kind of word problem',
    'sign-copy': 'Copied an expression with the wrong sign',
    'square': 'Treated a rectangle as a square',
    'sub-wrong-letter': 'Substituted for the wrong letter',
    'sum-is-difference': 'Mixed up sum and difference',
    'swap-quantities': 'Matched quantities to the wrong item',
    'times-dropped': 'Dropped a "times as many"',
    'times-in-total': 'Multiplied again in the total',
    'times-is-more': 'Read "times" as "more than"',
    'times-wrong-letter': '"Twice a number" put on the wrong number',
    'value-is-count': 'Used a value equation as the count',
    'vertical-line': 'Vertical line x = a',
    'wrong-rate': 'Used the other company\'s rate',
    'wrong-total': 'Used the other shopper\'s total',
  };

  const label = (k) => TRAPS[k]
    || (k.startsWith('hence-') ? 'The "hence" part of a ' + k.slice(6) + ' question'
    : k.startsWith('typed-') ? 'Writing a line of working by hand' : k);

  function reportRound() {
    return {
      noScore: true,
      noHint: true,
      prompt: 'For grown-ups — what the last two weeks show',
      question: '',
      mount(stage, submit) {
        const since = Date.now() - 14 * 864e5;
        const log = MathLab.readLog().filter((e) => e.t >= since);
        const rounds = log.filter((e) => e.kind === 'round');
        const days = new Set(log.map((e) => new Date(e.t).toDateString())).size;
        const firstTry = rounds.filter((e) => e.firstTry).length;

        const perApp = {};
        for (const r of rounds) {
          const k = r.app || '?';
          perApp[k] = perApp[k] || { n: 0, ok: 0 };
          perApp[k].n++;
          if (r.firstTry) perApp[k].ok++;
        }
        const appRows = Object.entries(perApp).sort((a, b) => b[1].n - a[1].n).map(([k, v]) => {
          const a = available.get(k) || { emoji: '', title: k };
          const pct = Math.round((100 * v.ok) / v.n);
          return '<tr><td>' + a.emoji + ' ' + a.title + '</td><td class="n">' + v.n + '</td><td class="n">' + pct + '%</td></tr>';
        }).join('');

        const trapCount = {};
        for (const e of log.filter((x) => x.kind === 'trap')) trapCount[e.trap] = (trapCount[e.trap] || 0) + 1;
        const trapRows = Object.entries(trapCount).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([k, n]) => {
          const max = Math.max(...Object.values(trapCount));
          return '<tr><td>' + label(k) + '</td><td class="n">' + n + '</td><td style="width:30%"><div class="bar" style="width:' + Math.round((100 * n) / max) + '%"></div></td></tr>';
        }).join('');

        const unfinished = log.filter((e) => e.kind === 'unfinished').length;
        const half = since + 7 * 864e5;
        const unf1 = log.filter((e) => e.kind === 'unfinished' && e.t < half).length;
        const unf2 = log.filter((e) => e.kind === 'unfinished' && e.t >= half).length;

        stage.innerHTML = '<div class="report">' +
          (rounds.length
            ? '<p class="summary-big">' + rounds.length + ' questions</p><p>on ' + days + ' day' + (days === 1 ? '' : 's') +
              ', ' + Math.round((100 * firstTry) / rounds.length) + '% right first time.</p>' +
              '<h3>By app</h3><table><tr><th>App</th><th class="n">Qs</th><th class="n">1st try</th></tr>' + appRows + '</table>' +
              '<h3>Mistakes met most</h3>' + (trapRows ? '<table>' + trapRows + '</table>' : '<p>None picked yet.</p>') +
              '<h3>Stopping before the end</h3><p>' + unfinished + ' times tried to submit with a part missing (' +
              unf1 + ' in week one, ' + unf2 + ' in week two). Fewer over time is the goal.</p>'
            : '<p>Nothing logged on this device yet. Play a few rounds first.</p>') +
          '<p class="kind-blurb">Stored only on this device. Nothing is sent anywhere.</p></div>';
        submit(true);
      },
    };
  }

  return [
    { name: 'Today\'s mix', make: sessionRound },
    { name: '📋 Report', make: reportRound },
  ];
  },
});
</script>
<script>MathLab.run('daily-mix');</script>
</body>
</html>
